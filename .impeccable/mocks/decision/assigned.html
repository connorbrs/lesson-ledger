<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Marking Night — Log</title>
<style>
  :root{--ink:#14213d;--ink2:#1b2b4d;--rule:#2b3b60;--paper:#eef1f6;--mute:#9aa6bf;--green:#3fb27f;--red:#e5484d;--hl:#f2d64b;--smith:#6fb7ff;--jones:#f0a35e}
  *{box-sizing:border-box;margin:0}
  html,body{width:390px;height:844px;overflow:hidden;background:var(--ink);color:var(--paper);font:17px/1.3 -apple-system,"SF Pro Text",system-ui,sans-serif}
  .bar{height:47px}
  h1{font:700 34px/1.1 -apple-system,"SF Pro Display",system-ui;letter-spacing:-.02em;padding:8px 20px 2px}
  .date{padding:0 20px 14px;color:var(--mute);font-size:15px}
  .date b{color:var(--paper);font-weight:600}
  .panel{margin:0 16px 14px;background:var(--ink2);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 16px;border-top:1px solid var(--rule)}
  .row:first-child{border-top:0}
  .lab{color:var(--mute);font-size:15px}
  .val{font-variant-numeric:tabular-nums;font-weight:600}
  .times{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:0}
  .t{padding:12px 16px;border-left:1px solid var(--rule)}.t:first-child{border-left:0}
  .t .lab{font-size:13px;display:block}.t .val{font-size:22px;letter-spacing:-.01em}
  .seg{display:flex;gap:6px}.seg span{padding:7px 14px;border-radius:9px;border:1px solid var(--rule);font-size:15px}
  .seg .on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}
  .who{gap:10px;justify-content:flex-start}
  .tag{width:10px;height:10px;border-radius:3px;background:var(--smith)}
  .split{display:grid;grid-template-columns:1fr 1fr 1fr}
  .split .t .val{font-size:20px}
  .hl{background:linear-gradient(transparent 55%,rgba(242,214,75,.35) 55%);padding:0 2px}
  .note{padding:0 32px 14px;color:var(--mute);font-size:13px}
  .recent{margin:4px 16px 0}
  .recent h2{font:600 13px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 4px 8px}
  .r{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--rule)}
  .r .n{flex:1}.r .n small{display:block;color:var(--mute);font-size:13px}
  .tick{width:22px;height:22px}
  .cta{position:absolute;left:16px;right:16px;bottom:96px;height:52px;border-radius:14px;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700}
  .tabs{position:absolute;left:0;right:0;bottom:0;height:83px;background:#0f1a31;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding-top:8px;text-align:center;font-size:11px;color:var(--mute)}
  .tabs i{display:block;width:24px;height:24px;margin:0 auto 4px;border:2px solid currentColor;border-radius:7px}
  .tabs .on{color:var(--paper)}
</style></head><body>
<div class="bar"></div>
<h1>Log</h1>
<p class="date"><b>Today</b> · Mon 19 Oct</p>
<div class="panel">
  <div class="row times"><div class="t"><span class="lab">Start</span><span class="val">4:00</span></div><div class="t"><span class="lab">Finish</span><span class="val">4:45</span></div><div class="t"><span class="lab">Duration</span><span class="val">0:45</span></div></div>
  <div class="row"><span class="lab">Subject</span><span class="seg"><span class="on">Swim</span><span>Math</span></span></div>
  <div class="row who"><span class="tag"></span><span>Ada</span><span class="lab" style="margin-left:auto">Test Smith ›</span></div>
</div>
<div class="panel">
  <div class="row split" style="padding:0"><div class="t"><span class="lab">Lesson</span><span class="val">0:45</span></div><div class="t"><span class="lab">Activity</span><span class="val">0:00</span></div><div class="t"><span class="lab">Travel</span><span class="val">0:10</span></div></div>
</div>
<p class="note">Travel stays with you. <span class="hl">Families never see it.</span></p>
<div class="recent"><h2>Logged today</h2>
  <div class="r"><svg class="tick" viewBox="0 0 24 24"><path d="M4 13l5 5L20 6" fill="none" stroke="#3fb27f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="n">Ada · Swim<small>3:00 – 3:45 · Lesson 0.75 h (0:45)</small></span></div>
</div>
<div class="cta">Log Session</div>
<nav class="tabs"><span class="on"><i></i>Log</span><span><i></i>Sessions</span><span><i></i>Summaries</span><span><i></i>People</span><span><i></i>Settings</span></nav>
</body></html>
