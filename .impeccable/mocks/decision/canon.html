<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>iOS standard — Log</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:390px;height:844px;overflow:hidden;background:#f2f2f7;color:#000;font:17px/1.3 -apple-system,system-ui,sans-serif}
  .bar{height:47px}
  h1{font:700 34px/1.1 -apple-system,system-ui;padding:8px 20px 12px}
  .hd{padding:0 36px 6px;font-size:13px;color:#6d6d72;text-transform:uppercase}
  .g{margin:0 16px 22px;background:#fff;border-radius:10px}
  .row{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 16px;border-top:.5px solid #c6c6c8;margin-left:0}
  .row:first-child{border-top:0}
  .v{color:#8e8e93}.b{color:#007aff}
  .seg{display:flex;background:#e3e3e8;border-radius:8px;padding:2px}.seg span{padding:5px 16px;border-radius:7px;font-size:15px}.seg .on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .cta{position:absolute;left:16px;right:16px;bottom:96px;height:50px;border-radius:12px;background:#007aff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
  .tabs{position:absolute;left:0;right:0;bottom:0;height:83px;background:rgba(249,249,249,.94);border-top:.5px solid #c6c6c8;display:grid;grid-template-columns:repeat(5,1fr);padding-top:8px;text-align:center;font-size:10px;color:#8e8e93}
  .tabs i{display:block;width:24px;height:24px;margin:0 auto 3px;background:currentColor;border-radius:6px;opacity:.85}.tabs .on{color:#007aff}
</style></head><body>
<div class="bar"></div><h1>Log</h1>
<p class="hd">Session</p>
<div class="g">
  <div class="row"><span>Date</span><span class="v">Today</span></div>
  <div class="row"><span>Start</span><span class="b">4:00 PM</span></div>
  <div class="row"><span>Finish</span><span class="b">4:45 PM</span></div>
  <div class="row"><span>Subject</span><span class="seg"><span class="on">Swim</span><span>Math</span></span></div>
</div>
<p class="hd">Minutes</p>
<div class="g">
  <div class="row"><span>Lesson</span><span class="v">0:45</span></div>
  <div class="row"><span>Activity</span><span class="v">0:15</span></div>
  <div class="row"><span>Travel</span><span class="v">0:10</span></div>
</div>
<div class="cta">Log Session</div>
<nav class="tabs"><span class="on"><i></i>Log</span><span><i></i>Sessions</span><span><i></i>Summaries</span><span><i></i>People</span><span><i></i>Settings</span></nav>
</body></html>
